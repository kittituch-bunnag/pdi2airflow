services:
  pdi2airflow:
    build: .
    ports:
      - "8765:8765"
    volumes:
      # Drop kettle.properties / repositories.xml here to apply project-wide defaults
      - ./config:/app/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
